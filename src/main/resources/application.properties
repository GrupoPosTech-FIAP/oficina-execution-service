spring.application.name=oficina-execution-service
server.port=${SERVER_PORT:8084}

# DynamoDB (banco NoSQL do serviço). Na AWS as tabelas vêm do Terraform (oficina-infra-database).
dynamodb.tabela-execucoes=${DYNAMODB_TABELA_EXECUCOES:oficina-execucoes}
dynamodb.tabela-outbox=${DYNAMODB_TABELA_OUTBOX:oficina-execution-outbox}
dynamodb.regiao=${AWS_REGION:us-east-1}
# DynamoDB Local / LocalStack em dev (ex.: http://localhost:4566); vazio usa a AWS
dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
dynamodb.criar-tabelas=${DYNAMODB_CRIAR_TABELAS:false}

# Actuator / Healthprobes (Kubernetes / EKS)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Segurança / JWT (compartilhado com oficina-app-api e oficina-auth-gateway)
jwt.secret=${JWT_SECRET:c2VjcmV0b0p3dFN1cGVyU2VndXJvUGFyYU9maWNpbmFBcGkxMjM0NTY3ODk=}

# Mensageria da Saga (ADR 005 em oficina-app-api). Desligada por padrão: os eventos são
# gravados na outbox, mas só saem do serviço com MENSAGERIA_HABILITADA=true.
mensageria.habilitada=${MENSAGERIA_HABILITADA:false}
mensageria.produtor=oficina-execution-service
mensageria.topico-arn=${MENSAGERIA_TOPICO_ARN:}
mensageria.fila-url=${MENSAGERIA_FILA_URL:}
mensageria.regiao=${AWS_REGION:us-east-1}
# LocalStack em dev (ex.: http://localhost:4566); vazio usa a AWS
mensageria.endpoint=${MENSAGERIA_ENDPOINT:}
# relay da outbox + consumidor SQS (long polling) não podem disputar a mesma thread
spring.task.scheduling.pool.size=2
